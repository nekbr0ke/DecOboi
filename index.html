<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DecOboi — обои для дома</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#EAF4FC; --ink:#17283A; --muted:#5E7C94;
  --brand:#2566A6; --brand-ink:#FFFFFF; --accent:#1AA0C4; --line:#D2E4F1; --danger:#B23A2E;
  --radius:2px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Manrope',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:500;margin:0;line-height:1.1;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{max-width:100%;}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px;}

/* header */
header.site{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);}
.topbar{display:flex;align-items:center;gap:24px;padding:16px 20px;max-width:1180px;margin:0 auto;flex-wrap:wrap;}
.logo{font-family:'Fraunces',serif;font-size:22px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:9px;}
.logo span{color:var(--brand);}
.logo svg{flex:none;transform-box:fill-box;transform-origin:50% 50%;transition:transform 1.3s cubic-bezier(.4,0,.2,1),filter 1.3s cubic-bezier(.4,0,.2,1);}
.logo:hover svg:not(.settled){transform:rotate(360deg);filter:hue-rotate(180deg) saturate(1.4);}
.search{flex:1;min-width:180px;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.search input{flex:1;border:none;background:none;padding:10px 12px;color:var(--ink);font-family:inherit;font-size:14px;outline:none;}
.search button{padding:0 14px;color:var(--muted);}
.cart-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;}
.cart-count{background:var(--brand);color:var(--brand-ink);border-radius:100px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;padding:0 5px;}
nav.tabs{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:0 20px 14px;overflow-x:auto;}
nav.tabs a{padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted);border-radius:100px;white-space:nowrap;border:1.5px solid transparent;transition:border-color .2s ease;}
nav.tabs a.active{color:var(--brand-ink);background:var(--brand);}
nav.tabs a[data-r="/new"]:not(.active){color:#D1372B;}
nav.tabs a[data-r="/new"].active{background:#D1372B;color:#fff;}
nav.tabs a:hover{border-color:var(--brand);}
nav.tabs a[data-r="/new"]:hover{border-color:#D1372B;}

main{padding-bottom:64px;}

/* hero */
.hero{padding:56px 0 40px;border-bottom:1px solid var(--line);}
.hero-grid{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;}
.hero h1{font-size:clamp(30px,4.2vw,50px);letter-spacing:-0.01em;max-width:14ch;}
.hero p{color:var(--muted);font-size:16px;max-width:44ch;margin:16px 0 24px;}
.btn{display:inline-block;padding:13px 24px;background:var(--brand);color:var(--brand-ink);border-radius:var(--radius);font-weight:700;font-size:14px;}
.btn.secondary{background:transparent;border:1px solid var(--ink);color:var(--ink);}
.hero-swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.hero-swatches>div{aspect-ratio:1;border-radius:var(--radius);overflow:hidden;}

/* chips */
.chips{display:flex;gap:10px;padding:28px 0 8px;overflow-x:auto;}
.chip{padding:9px 16px;border:1px solid var(--line);border-radius:100px;font-size:13px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--brand);}
.chip:hover{border-color:var(--brand);background:var(--brand);color:var(--brand-ink);}

section{padding:36px 0;}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.section-head h2{font-size:24px;}
.section-head a{font-size:13px;font-weight:700;color:var(--brand);}

/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr);} .hero-grid{grid-template-columns:1fr;}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;}
.swatch{aspect-ratio:1;position:relative;}
.badge{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:4px 8px;border-radius:100px;background:var(--ink);color:var(--bg);}
.badge.sale{background:var(--accent);color:#fff;}
.fav{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:100px;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;font-size:14px;color:#5B6670;cursor:pointer;}
.fav.active{color:#D1372B;}
.card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-coll{font-size:12px;color:var(--muted);}
.card-name{font-size:14.5px;font-weight:700;font-family:'Manrope',sans-serif;}
.card-meta{font-size:12px;color:var(--muted);}
.price-row{margin-top:auto;display:flex;align-items:baseline;gap:8px;padding-top:6px;}
.price{font-weight:800;font-size:16px;}
.price-old{font-size:13px;color:var(--muted);text-decoration:line-through;}
.add-btn{margin-top:10px;padding:9px;border:1px solid var(--brand);border-radius:var(--radius);color:var(--brand);font-weight:700;font-size:13px;text-align:center;transition:background-color .2s ease,color .2s ease;}
.add-btn:hover{background:var(--brand);color:var(--brand-ink);cursor:pointer;}
.add-btn.in{background:var(--brand);color:var(--brand-ink);}
.card-qty{margin-top:10px;width:100%;justify-content:space-between;border-color:var(--brand);padding:3px 8px;}
.card-qty button{width:28px;height:28px;font-size:16px;color:var(--brand);}
.card-qty span{width:auto;font-weight:700;color:var(--ink);font-size:14px;}

/* promo */
.promo{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
.promo h2{font-size:26px;}
.promo p{color:var(--muted);margin:6px 0 0;}

/* catalog layout */
.catalog-layout{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:start;}
@media(max-width:800px){.catalog-layout{grid-template-columns:1fr;}}
.filters{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--surface);}
@media(min-width:801px){.filters{position:sticky;top:112px;max-height:calc(100vh - 132px);overflow-y:auto;z-index:1;}}
.filters h3{font-size:13px;text-transform:none;margin-bottom:10px;}
.filter-group{margin-bottom:20px;}
.filter-group label{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:4px 0;color:var(--ink);}
.catalog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.catalog-top select{padding:8px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px;}
.count{font-size:13px;color:var(--muted);}

/* cart */
.cart-layout{display:grid;grid-template-columns:1fr 300px;gap:28px;align-items:start;}
@media(max-width:800px){.cart-layout{grid-template-columns:1fr;}}
.cart-item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0;}
.cart-item .sw{width:76px;height:76px;border-radius:var(--radius);}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);}
.qty button{width:26px;height:26px;font-weight:700;}
.qty span{width:24px;text-align:center;font-size:13px;}
.remove{font-size:12px;color:var(--muted);margin-top:6px;}
.summary{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--surface);}
.summary-row{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;}
.summary-row.total{font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:8px;padding-top:12px;}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--ink);font-family:inherit;font-size:14px;margin-bottom:10px;}
.authtabs{display:flex;gap:8px;margin:16px 0 20px;}
.authtabs button{padding:8px 16px;border:1px solid var(--line);border-radius:100px;font-weight:700;font-size:13px;background:var(--surface);color:var(--muted);}
.authtabs button.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);}
.order-card{border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:var(--surface);}
.order-head{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);}
.order-line{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;}
.order-total{display:flex;justify-content:space-between;font-weight:800;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;}
.product-layout{display:grid;grid-template-columns:320px 1fr 280px;gap:32px;align-items:start;padding-bottom:40px;}
.product-layout>.swatch{aspect-ratio:1;border-radius:var(--radius);border:1px solid var(--line);}
@media(max-width:960px){.product-layout{grid-template-columns:1fr;}}
.spec-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding:7px 0;font-size:13.5px;}
.spec-row span:first-child{color:var(--muted);}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.perk{font-size:13px;background:var(--surface-2);border-radius:var(--radius);padding:9px 10px;}
.price-box{border:1px solid var(--line);border-radius:var(--radius);padding:20px;background:var(--surface);position:sticky;top:112px;}
.img-modal{position:fixed;inset:0;background:rgba(10,12,10,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:40px 20px;padding-top:calc(40px + env(safe-area-inset-top,0px));}
.img-modal.open{display:flex;}
.img-modal-box{width:min(85vw,620px);aspect-ratio:1;border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.4);}
.img-modal-close{position:absolute;top:20px;right:24px;width:40px;height:40px;border-radius:100px;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.about-intro{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:36px 0;}
.about-intro h1{font-size:clamp(28px,3.6vw,42px);margin-bottom:14px;}
.about-intro p{color:var(--muted);line-height:1.6;margin:0 0 12px;max-width:56ch;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:8px 0 36px;}
.stat{background:var(--surface-2);border-radius:var(--radius);padding:18px;}
.stat b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--brand);font-weight:600;}
.stat span{font-size:13px;color:var(--muted);}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.photos figure{margin:0;}
.photos svg{width:100%;height:auto;display:block;border-radius:var(--radius);border:1px solid var(--line);}
.photos figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;}
.contact-box{margin-top:36px;border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
.contact-box h3{font-size:13px;color:var(--muted);font-family:'Manrope',sans-serif;font-weight:600;margin-bottom:6px;}
.contact-box div div{font-size:15px;font-weight:600;line-height:1.5;}
@media(max-width:800px){.about-intro,.photos,.contact-box{grid-template-columns:1fr;}.stats{grid-template-columns:1fr;}}
.notice{margin-top:18px;padding:12px 14px;background:#FFF4D6;border:1px solid #F0D58A;border-left:4px solid #E0A800;border-radius:var(--radius);font-size:13.5px;font-weight:600;color:#5C4600;line-height:1.5;}
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.calc-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:600;}
.calc-field .input{margin-bottom:14px;}
.calc-result .big{font-family:'Fraunces',serif;font-size:44px;color:var(--brand);font-weight:600;line-height:1;}
@media(max-width:520px){.calc-grid{grid-template-columns:1fr;}}
.img-modal-box.photo{aspect-ratio:auto;width:min(94vw,1100px);height:86vh;box-shadow:none;background:transparent;}
.img-modal-box.photo .ph-wrap img{object-fit:contain;}
.to-top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:100px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(20,60,110,.3);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s ease,transform .2s ease,background-color .2s ease;z-index:40;cursor:pointer;}
.to-top.show{opacity:1;pointer-events:auto;transform:none;}
.to-top:hover{background:var(--accent);}
.no-photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:var(--muted);}
.coll-card .swatch{aspect-ratio:4/3;}
.coll-card:hover{border-color:var(--brand);}
.ph-wrap{position:absolute;inset:0;}
.ph-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.ph-nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:100px;background:rgba(255,255,255,.88);color:#17283A;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer;}
.ph-nav.prev{left:6px;}.ph-nav.next{right:6px;}
.ph-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2;pointer-events:none;}
.ph-dots i{width:6px;height:6px;border-radius:100px;background:rgba(255,255,255,.6);}
.ph-dots i.on{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);}
.empty{text-align:center;padding:60px 20px;color:var(--muted);}
.empty h2{color:var(--ink);margin-bottom:10px;}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13px;text-align:center;}
</style>
</head>
<body>
<header class="site">
  <div class="topbar">
    <a href="#/" class="logo">
      <svg width="26" height="26" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="24" cy="13" r="8" fill="#E0564A"/>
        <circle cx="35" cy="20" r="8" fill="#E8973C"/>
        <circle cx="31" cy="33" r="8" fill="#4F9D5C"/>
        <circle cx="17" cy="33" r="8" fill="#3E7FBF"/>
        <circle cx="13" cy="20" r="8" fill="#8A5FC2"/>
        <circle cx="24" cy="24" r="7" fill="#F4C945"/>
      </svg>
      <span class="logo-word">Dec<span>Oboi</span></span>
    </a>
    <form class="search" onsubmit="return false;">
      <input type="text" id="searchInput" placeholder="">
      <button type="button" aria-label="Найти">🔍</button>
    </form>
    <button class="cart-btn" onclick="location.hash='#/account'">👤 <span id="accountLabel">Войти</span></button>
    <button class="cart-btn" onclick="location.hash='#/cart'">🛒 Корзина <span class="cart-count" id="cartCount">0</span></button>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#/" data-r="/">Главная</a>
    <a href="#/catalog" data-r="/catalog">Каталог</a>
    <a href="#/new" data-r="/new">Новинки</a>
    <a href="#/sale" data-r="/sale">Распродажа</a>
    <a href="#/calc" data-r="/calc">Калькулятор</a>
    <a href="#/favorites" data-r="/favorites">Избранное</a>
    <a href="#/about" data-r="/about">О нас</a>
  </nav>
</header>
<main id="app"></main>
<footer><div class="wrap">DecOboi — витрина обоев. Демонстрационный магазин, каталог будет дополняться.</div></footer>

    <div class="swatch" style="${swatchStyle(p)}">${photoImg(p)}${badge}<span class="fav${favorites[p.id]?' active':''}" data-fav="${p.id}">${favorites[p.id]?'♥':'♡'}</span></div>
    <div class="card-body">
      <div class="card-coll">${[p.brand,p.country,p.coll].filter(Boolean).join(' · ')}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-meta">${metaLine(p)}</div>
      <div class="price-row">
        ${p.price==null?'<span class="price" style="font-size:14px;color:var(--muted);">Цена по запросу</span>':`<span class="price">${p.price.toLocaleString('ru-RU')} ₽</span>`}
        ${p.old?`<span class="price-old">${p.old.toLocaleString('ru-RU')} ₽</span>`:''}
      </div>
      ${controls}
    </div>
  </div>`;
}

function grid(list,key){
  const lim=key?(limits[key]||48):list.length;
  const more=key&&list.length>lim?`<div style="text-align:center;margin:24px 0 0;"><button class="btn secondary" data-more="${key}">Показать ещё (${Math.min(48,list.length-lim)})</button></div>`:'';
  return `<div class="grid">${list.slice(0,lim).map(card).join('')}</div>${more}`;
}

let catalogState={room:'all',cat:'all',brand:'all',coll:'all',stock:false,q:'',widths:[],sort:'default'};

}

function renderCatalog(){
  let list=PRODUCTS.slice();
  if(catalogState.room!=='all')list=list.filter(p=>p.room===catalogState.room);
  if(catalogState.cat!=='all')list=list.filter(p=>p.cat===catalogState.cat);
  if(catalogState.brand!=='all')list=list.filter(p=>p.brand===catalogState.brand);
  if(catalogState.widths.length>0)list=list.filter(p=>catalogState.widths.includes(p.width));
  if(catalogState.coll!=='all')list=list.filter(p=>p.coll===catalogState.coll);
  if(catalogState.stock)list=list.filter(p=>p.real?p.avail===1:true);
  if(catalogState.q){const t=catalogState.q.toLowerCase();list=list.filter(p=>(p.hay||(p.hay=(p.name+' '+p.coll+' '+p.brand+' '+(p.article||'')).toLowerCase())).includes(t));}
  if(catalogState.sort==='default')list.sort((a,b)=>(b.real?1:0)-(a.real?1:0)||((b.avail===1)-(a.avail===1)));
  if(catalogState.sort==='price-asc')list.sort((a,b)=>(a.price??1e12)-(b.price??1e12));
  if(catalogState.sort==='price-desc')list.sort((a,b)=>(b.price??-1)-(a.price??-1));
  if(catalogState.sort==='new')list=list.filter(p=>p.isNew).concat(list.filter(p=>!p.isNew));
  let tiles='';
  if(catalogState.brand!=='all'&&catalogState.coll==='all'&&!catalogState.q){
    const groups=new Map();
    list.forEach(p=>{if(p.coll){if(!groups.has(p.coll))groups.set(p.coll,[]);groups.get(p.coll).push(p);}});
    if(groups.size>0){
      tiles=`<div class="grid coll-grid">${[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ru')).map(([name,items])=>{
        const cover=items.find(x=>photosFor(x).length)||items[0];
        return `<div class="card coll-card" data-coll-pick="${esc(name)}" style="cursor:pointer;"><div class="swatch" style="${swatchStyle(cover)}">${photoImg(cover)}</div><div class="card-body"><div class="card-coll">${esc(catalogState.brand)}</div><div class="card-name">${esc(name)}</div><div class="card-meta">${items.length} ${items.length%10===1&&items.length%100!==11?'позиция':(items.length%10>=2&&items.length%10<=4&&(items.length%100<10||items.length%100>=20))?'позиции':'позиций'}</div></div></div>`;
      }).join('')}</div>`;
      tiles={html:tiles,count:groups.size};
    }
  }
  const backLink=(catalogState.brand!=='all'&&catalogState.coll!=='all')?`<a href="#/catalog" data-allcolls="1" style="display:inline-block;margin-bottom:12px;font-size:13px;font-weight:700;color:var(--brand);">← Все каталоги бренда</a>`:'';
  return `<div class="wrap"><h2 style="padding:24px 0 4px;font-size:26px;">Каталог</h2>
  <div class="catalog-layout" style="margin-top:16px;">
    <aside class="filters">
      <h3>Категория</h3>
      <div class="filter-group">
        <label><input type="radio" name="cat" value="all" ${catalogState.cat==='all'?'checked':''}> Все товары</label>
        ${CATS.map(c=>`<label><input type="radio" name="cat" value="${c}" ${catalogState.cat===c?'checked':''}> ${c}</label>`).join('')}
      </div>
      <h3>Производитель</h3>
      <div class="filter-group">
        <label><input type="radio" name="brand" value="all" ${catalogState.brand==='all'?'checked':''}> Все бренды</label>
        ${brandsFor(catalogState.cat).map(b=>`<label><input type="radio" name="brand" value="${b}" ${catalogState.brand===b?'checked':''}> ${b}</label>`).join('')}
      </div>
      <h3>Коллекция</h3>
      <div class="filter-group"><select class="input" id="collSel" style="margin:0;"><option value="all">Все коллекции</option>${collsFor(catalogState.brand,catalogState.cat).map(c=>`<option value="${esc(c)}" ${catalogState.coll===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="filter-group"><label><input type="checkbox" id="stockChk" ${catalogState.stock?'checked':''}> Только в наличии</label></div>
      <h3>Ширина рулона</h3>
      <div class="filter-group">
        <label><input type="checkbox" name="width" value="0.53 м" ${catalogState.widths.includes('0.53 м')?'checked':''}> 0.53 м</label>
        <label><input type="checkbox" name="width" value="0.7 м" ${catalogState.widths.includes('0.7 м')?'checked':''}> 0.7 м</label>
        <label><input type="checkbox" name="width" value="1.06 м" ${catalogState.widths.includes('1.06 м')?'checked':''}> 1.06 м</label>
      </div>
    </aside>
    <div>
      <div class="catalog-top">
        <span class="count">${tiles?`Каталогов: ${tiles.count}`:`Показано ${Math.min(list.length,limits.catalog||48)} из ${list.length}`}</span>${catalogState.q?`<span class="chip" data-clearq="1" style="cursor:pointer;">Поиск: «${esc(catalogState.q)}» ✕</span>`:''}
        <select id="sortSel">
          <option value="default" ${catalogState.sort==='default'?'selected':''}>По популярности</option>
          <option value="price-asc" ${catalogState.sort==='price-asc'?'selected':''}>Сначала дешевле</option>
          <option value="price-desc" ${catalogState.sort==='price-desc'?'selected':''}>Сначала дороже</option>
          <option value="new" ${catalogState.sort==='new'?'selected':''}>Сначала новинки</option>
        </select>
      </div>
      ${tiles?tiles.html:backLink+grid(list,'catalog')}
    </div>
  </div></div>`;
}

function renderNew(){
  const list=PRODUCTS.filter(p=>p.isNew);

function starsHtml(n){
  const r=Math.round(n);
  let h='';
  for(let i=1;i<=5;i++)h+=`<span style="color:${i<=r?'#F2B705':'#D9E2EA'};">★</span>`;
  return h;
}

}

          <div class="calc-field"><label for="cRw">Ширина рулона</label>
            <select class="input" id="cRw"><option value="0.53">0.53 м</option><option value="0.7">0.7 м</option><option value="1.06">1.06 м</option></select></div>
          ${calcField('cRl','Длина рулона, м',10.05,0.05)}
          ${calcField('cRep','Раппорт (подгонка рисунка), см',0,1)}
          ${calcField('cPrice','Цена за рулон, ₽ (необязательно)',0,10)}
        </div>
      </div>
      <div class="summary calc-result" id="calcResult"></div>
    </div>
  </div>`;
}
function runCalc(){
  const out=document.getElementById('calcResult');
  if(!out)return;
  const v=id=>parseFloat(document.getElementById(id)?.value)||0;
  const L=v('cLen'),W=v('cWid'),H=v('cHei'),doors=1,wins=1;
  const rw=v('cRw'),rl=v('cRl'),rep=v('cRep')/100,price=v('cPrice');
  if(!L||!W||!H||!rw||!rl){out.innerHTML='<p style="color:var(--muted);margin:0;">Заполните размеры комнаты и рулона.</p>';return;}
  const perimeter=2*(L+W);
  const sel=(s,c)=>{
    const el=document.getElementById(s),ci=document.getElementById(c);
    const custom=el&&el.value==='custom';
    if(ci)ci.style.display=custom?'block':'none';
    return (custom?v(c):parseFloat(el?.value)||0)/100;
  };
  const doorW=sel('cDoorW','cDoorC'),winW=sel('cWinW','cWinC');
  const eff=Math.max(perimeter-doors*doorW-wins*winW,0);
  const strips=Math.ceil(eff/rw);
  let stripLen=H+0.1;
  if(rep>0)stripLen=Math.ceil(stripLen/rep)*rep;
  const perRoll=Math.floor(rl/stripLen);
  if(perRoll<1){out.innerHTML='<p style="color:#B23A2E;margin:0;">Полоса получается длиннее рулона — проверьте высоту и длину рулона.</p>';return;}
  const rolls=Math.ceil(strips/perRoll);
  const cost=price>0?`<div class="summary-row"><span>Примерная стоимость</span><span>${(rolls*price).toLocaleString('ru-RU')} ₽</span></div>`:'';
  out.innerHTML=`
    <div style="font-size:13px;color:var(--muted);margin-bottom:6px;">Потребуется</div>
    <div class="big">${rolls} <span style="font-size:18px;font-family:'Manrope',sans-serif;">рул.</span></div>
    <div style="margin-top:14px;">
      <div class="summary-row"><span>Периметр комнаты</span><span>${perimeter.toFixed(1)} м</span></div>
      <div class="summary-row"><span>Полос обоев</span><span>${strips}</span></div>
      <div class="summary-row"><span>Длина полосы</span><span>${stripLen.toFixed(2)} м</span></div>
      <div class="summary-row"><span>Полос из рулона</span><span>${perRoll}</span></div>
      ${cost}
    </div>
    <p style="font-size:12px;color:var(--muted);margin:12px 0 0;line-height:1.5;">Расчёт приблизительный: учтён запас 10 см на подрезку, а также ширина двери и окна. Рекомендуем взять 1 рулон про запас.</p>
    <a href="#/catalog" class="btn" style="display:block;text-align:center;margin-top:14px;">Выбрать обои</a>`;
}

function orderCard(o){
  return `<div class="order-card">
    <div class="order-head"><span>Заказ от ${o.date}</span><span>№${o.id}</span></div>
    ${o.items.map(it=>`<div class="order-line"><span>${it.name} × ${it.qty}</span><span>${(it.price*it.qty).toLocaleString('ru-RU')} ₽</span></div>`).join('')}
    <div class="order-total"><span>Итого</span><span>${o.total.toLocaleString('ru-RU')} ₽</span></div>
  </div>`;
}

function renderAccount(){
  if(!session){
    return `<div class="wrap" style="max-width:420px;">
      <h2 style="padding:24px 0 4px;font-size:26px;">Аккаунт</h2>
      <p style="color:var(--muted);font-size:13px;margin:6px 0 0;">Демо-авторизация: данные хранятся только в этом браузере, почта/телефон не проверяются.</p>
      <div class="authtabs">
        <button data-authmode="login" class="${authMode==='login'?'active':''}">Войти</button>
        <button data-authmode="register" class="${authMode==='register'?'active':''}">Регистрация</button>
      </div>
      ${authMode==='register'?'<input id="authName" class="input" placeholder="Имя">':''}
      <input id="authId" class="input" placeholder="Почта или телефон">
      <input id="authPass" type="password" class="input" placeholder="Пароль">
      ${authError?`<div style="color:#B23A2E;font-size:13px;margin:-2px 0 10px;">${authError}</div>`:''}
      <button class="btn" style="width:100%;" data-action="submit-auth">${authMode==='register'?'Создать аккаунт':'Войти'}</button>
    </div>`;
  }
  const u=users[session];
  const orders=u.orders||[];
  return `<div class="wrap">
    <div class="section-head"><h2>Здравствуйте, ${u.name||session}</h2><button class="add-btn" style="padding:9px 16px;" data-action="logout">Выйти</button></div>
    <h3 style="font-size:16px;margin:18px 0 12px;">Мои заказы</h3>
    ${orders.length?orders.map(orderCard).join(''):'<p style="color:var(--muted);">Заказов пока нет — оформите первый в корзине.</p>'}
  </div>`;
}

function renderCart(){
  const ids=Object.keys(cart).filter(id=>cart[id]>0);
  if(ids.length===0){
    return `<div class="wrap"><div class="empty"><h2>Корзина пуста</h2><p>В каталоге четырнадцать коллекций — самое время выбрать обои для комнаты.</p><br>
    <a href="#/catalog" class="btn">Перейти в каталог</a></div></div>`;
  }
  const items=ids.map(id=>PRODUCTS.find(p=>p.id==id));
  const subtotal=items.reduce((s,p)=>s+p.price*cart[p.id],0);
  return `<div class="wrap"><h2 style="padding:24px 0 20px;font-size:26px;">Корзина</h2>
  <div class="cart-layout">
    <div>
      ${items.map(p=>`<div class="cart-item">
        <div class="sw" style="${swatchStyle(p)}"></div>
        <div>
          <div class="card-name">${p.name}</div>
          <div class="card-meta">${metaLine(p)}</div>
          <div class="qty" style="margin-top:8px;">
            <button data-qty="-1" data-id="${p.id}">−</button>
            <span>${cart[p.id]}</span>
            <button data-qty="1" data-id="${p.id}">+</button>
          </div>
          <button class="remove" data-remove="${p.id}">Удалить</button>
        </div>
        <div class="price" style="text-align:right;">${(p.price*cart[p.id]).toLocaleString('ru-RU')} ₽</div>
      </div>`).join('')}
    </div>
    <div class="summary">
      <div class="summary-row"><span>Товары (${ids.reduce((a,id)=>a+cart[id],0)})</span><span>${subtotal.toLocaleString('ru-RU')} ₽</span></div>
      <div class="summary-row"><span>Доставка</span><span>Рассчитывается на шаге оформления</span></div>
      <div class="summary-row total"><span>Итого</span><span>${subtotal.toLocaleString('ru-RU')} ₽</span></div>
      <button class="btn" style="width:100%;margin-top:14px;" data-action="checkout">Оформить заказ</button>
      ${!session?'<p style="font-size:12px;color:var(--muted);margin-top:8px;">Для оформления нужно войти в аккаунт.</p>':''}
    </div>
  </div></div>`;
}

function route(keepScroll){
  const h=location.hash.replace('#','')||'/';
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('active',a.dataset.r===h));
  const app=document.getElementById('app');
  if(h==='/')app.innerHTML=renderHome();
  else if(h==='/catalog')app.innerHTML=renderCatalog();
  else if(h==='/new')app.innerHTML=renderNew();
  else if(h==='/sale')app.innerHTML=renderSale();
  else if(h==='/favorites')app.innerHTML=renderFavorites();
  else if(h==='/account')app.innerHTML=renderAccount();
  else if(h==='/about')app.innerHTML=renderAbout();
  else if(h==='/calc')app.innerHTML=renderCalc();
  else if(h.startsWith('/product/'))app.innerHTML=renderProduct(h.split('/')[2]);
  else if(h==='/cart')app.innerHTML=renderCart();
  else app.innerHTML=renderHome();
  updateAccountLabel();
  if(!keepScroll){
    window.scrollTo(0,0);
    requestAnimationFrame(()=>window.scrollTo(0,0));
  }
}
try{history.scrollRestoration='manual';}catch(e){}
document.querySelector('header.site').addEventListener('click',e=>{
  const el=e.target.closest('a[href^="#/"],.cart-btn');
  if(!el)return;
  const href=el.getAttribute('href');
  if(href&&location.hash===href)route();
  else window.scrollTo(0,0);
});

document.addEventListener('click',e=>{
  if(e.target.closest('[data-back]')&&window.__navigated){e.preventDefault();history.back();return;}
  const add=e.target.closest('[data-add]');
  if(add){const id=add.dataset.add;cart[id]=(cart[id]||0)+1;saveCart();updateCartBadge();route(true);return;}
  const fav=e.target.closest('[data-fav]');
  if(fav){const id=fav.dataset.fav;if(favorites[id])delete favorites[id];else favorites[id]=true;saveFavs();route(true);return;}
  const authModeBtn=e.target.closest('[data-authmode]');
  if(authModeBtn){authMode=authModeBtn.dataset.authmode;authError='';route(true);return;}
  const authSubmit=e.target.closest('[data-action="submit-auth"]');
  if(authSubmit){doAuth(authMode);return;}
  const logoutBtn=e.target.closest('[data-action="logout"]');
  if(logoutBtn){session=null;saveSession();route(true);return;}
  const checkoutBtn=e.target.closest('[data-action="checkout"]');
  if(checkoutBtn){
    if(!session){location.hash='#/account';return;}
    const ids=Object.keys(cart).filter(id=>cart[id]>0);
    if(ids.length===0)return;
    const items=ids.map(id=>{const p=PRODUCTS.find(x=>x.id==id);return{name:p.name,qty:cart[id],price:p.price};});
    const total=items.reduce((s,it)=>s+it.price*it.qty,0);
    users[session].orders=users[session].orders||[];
    users[session].orders.unshift({id:Date.now(),date:new Date().toLocaleDateString('ru-RU'),items,total});
    saveUsers();
    cart={};saveCart();updateCartBadge();
    location.hash='#/account';
    return;
  }
  const chip=e.target.closest('[data-room-chip]');
  if(chip){location.hash='#/catalog';return;}
  const qty=e.target.closest('[data-qty]');
  if(qty){const id=qty.dataset.id;const d=parseInt(qty.dataset.qty);cart[id]=Math.max(0,(cart[id]||0)+d);if(cart[id]===0)delete cart[id];saveCart();updateCartBadge();route(true);return;}
  const rem=e.target.closest('[data-remove]');
  if(rem){delete cart[rem.dataset.remove];saveCart();updateCartBadge();route(true);return;}
  const phb=e.target.closest('[data-ph]');
  if(phb){
    const box=phb.closest('.ph-wrap'),pp=PRODUCTS.find(x=>x.id==box.dataset.pid),list=photosFor(pp,box.dataset.full==='1'),n=list.length;
    const i=(Number(box.dataset.i)+Number(phb.dataset.ph)+n)%n;
    box.dataset.i=i;
    const img=box.querySelector('img');img.style.display='';img.src=list[i];
    box.querySelectorAll('.ph-dots i').forEach((d,k)=>d.classList.toggle('on',k===i));
    return;
  }
  const cp=e.target.closest('[data-coll-pick]');
  if(cp){catalogState.coll=cp.dataset.collPick;limits.catalog=48;route();return;}
  if(e.target.closest('[data-allcolls]')){e.preventDefault();catalogState.coll='all';limits.catalog=48;route();return;}
  if(e.target.closest('[data-ask]')){location.hash='#/about';return;}
  const more=e.target.closest('[data-more]');
  if(more){limits[more.dataset.more]=(limits[more.dataset.more]||48)+48;route(true);return;}
  if(e.target.closest('[data-clearq]')){catalogState.q='';limits.catalog=48;route(true);return;}
  const prod=e.target.closest('[data-product]');
  if(prod){location.hash='#/product/'+prod.dataset.product;return;}
  const zoom=e.target.closest('[data-zoom]');
  if(zoom){
    const p=PRODUCTS.find(x=>x.id==zoom.dataset.zoom);
    if(p){const box=document.getElementById('imgModalBox'),ph=photoImg(p,true);box.className='img-modal-box'+(ph?' photo':'');box.style.cssText=ph?'position:relative;':swatchStyle(p)+';position:relative;';box.innerHTML=ph;document.getElementById('imgModal').classList.add('open');}
    return;
  }
  if(e.target.id==='imgModal'||e.target.id==='imgModalClose'){document.getElementById('imgModal').classList.remove('open');return;}
});
['input','change'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target.closest&&e.target.closest('#calcForm'))runCalc();}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('imgModal').classList.remove('open');});
document.addEventListener('change',e=>{
  if(e.target.closest&&e.target.closest('.filters,.catalog-top'))limits.catalog=48;
  if(e.target.id==='collSel'){catalogState.coll=e.target.value;route(true);}
  if(e.target.id==='stockChk'){catalogState.stock=e.target.checked;route(true);}
  if(e.target.name==='room'){catalogState.room=e.target.value;route(true);}
  if(e.target.name==='cat'){catalogState.cat=e.target.value;if(!brandsFor(catalogState.cat).includes(catalogState.brand))catalogState.brand='all';catalogState.coll='all';route(true);}
  if(e.target.name==='brand'){catalogState.brand=e.target.value;catalogState.coll='all';route(true);}
  if(e.target.name==='width'){
    const v=e.target.value,i=catalogState.widths.indexOf(v);
    if(e.target.checked){if(i===-1)catalogState.widths.push(v);}else if(i>-1)catalogState.widths.splice(i,1);
    route(true);
  }
  if(e.target.id==='sortSel'){catalogState.sort=e.target.value;route(true);}
});
// Запоминаем прокрутку каждой страницы: «назад» возвращает туда, откуда пришли
const scrollPos={};let navKey=null,navSeq=Date.now();
function ensureKey(){
  const st=history.state;
  if(st&&st.k){navKey=st.k;return true;}
  navKey=++navSeq;
  try{history.replaceState({k:navKey},'');}catch(e){}
  return false;
}
window.addEventListener('hashchange',()=>{
  if(navKey!==null)scrollPos[navKey]=window.scrollY;
  window.__navigated=true;
  const restored=ensureKey();
  const y=scrollPos[navKey];
  if(restored&&y!=null){route(true);window.scrollTo(0,y);requestAnimationFrame(()=>window.scrollTo(0,y));}
  else route();
});
// Кнопка «вверх»
(function(){
  const upd=()=>{const b=document.getElementById('toTop');if(b)b.classList.toggle('show',window.scrollY>500);};
  window.addEventListener('scroll',upd,{passive:true});
  document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#toTop'))window.scrollTo({top:0,behavior:'smooth'});});
  upd();
})();
const SEARCH_PHRASES=['Искать по артикулу или коллекции…','Например: Bodega, Spectrum, 15023-1…','Бренды: Marburg, Allori, Rossi, Grandeco…'];
(function(){
  const form=document.querySelector('.search'),input=document.getElementById('searchInput');
  const go=()=>{
    catalogState.q=input.value.trim();catalogState.cat='all';catalogState.brand='all';catalogState.coll='all';catalogState.widths=[];catalogState.stock=false;limits.catalog=48;
    if(location.hash==='#/catalog')route();else location.hash='#/catalog';
  };
  form.addEventListener('submit',go);
  form.querySelector('button').addEventListener('click',go);
})();
let twPhrase=0;
function typewriter(){
  const el=document.getElementById('searchInput');
  if(!el){return;}
  const text=SEARCH_PHRASES[twPhrase%SEARCH_PHRASES.length];
  let i=0;
  const typeInt=setInterval(()=>{
    i++;
    el.placeholder=text.slice(0,i);
    if(i>=text.length){
      clearInterval(typeInt);
      setTimeout(()=>{twPhrase++;typewriter();},15000);
    }
  },55);
}
typewriter();
(function(){
  const logoEl=document.querySelector('.logo'), svgEl=logoEl?.querySelector('svg');
  if(!logoEl||!svgEl)return;
  let t=null;
  logoEl.addEventListener('mouseenter',()=>{
    svgEl.classList.remove('settled');
    clearTimeout(t);
    t=setTimeout(()=>svgEl.classList.add('settled'),1300);
  });
  logoEl.addEventListener('mouseleave',()=>{
    clearTimeout(t);
    svgEl.classList.remove('settled');
  });
})();
Object.keys(cart).forEach(id=>{if(!PRODUCTS.some(p=>p.id==id))delete cart[id];});saveCart();
Object.keys(favorites).forEach(id=>{if(!PRODUCTS.some(p=>p.id==id))delete favorites[id];});saveFavs();
ensureKey();
updateCartBadge();
route();
fetch('photos-manifest.json').then(r=>r.ok?r.json():{}).then(j=>{PHOTOS=j||{};}).catch(()=>{}).then(()=>{PHOTOS_LOADED=true;route(true);});
</script>
